{% load static %}
<link rel="stylesheet" href="{% static 'library/library.css' %}" />

<nav>
  | <a href="{% url 'books' %}">All books</a> |
  <a href="{% url 'librarian' %}">Librarian</a> {% if user.is_authenticated %} |
  <span>{{ user.username }}</span> |
  <a href="{% url 'logout' %}">Logout</a> {%else %} |
  <a href="{% url 'login' %}">Login</a>
  {% endif %}
</nav>

<h1>Books</h1>

<ul>
  {% for book in books %}
  <li>
    <a href="{% url 'book_detail' isbn=book.isbn %}">{{ book.title }}</a>
    — {{ book.author.name }}
  </li>
  {% empty %}
  <li>No books found.</li>
  {% endfor %}
</ul>
