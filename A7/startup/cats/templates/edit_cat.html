<!DOCTYPE html>
<html>
<head>
    <title>Edit Cat</title>
</head>
<body>

<header>
    {% if user.is_authenticated %}
        Logged in as {{ user.username }}
    {% endif %}
</header>

<h1>Edit Cat</h1>

{% if error %}
    <p style="color: red;">{{ error }}</p>
{% endif %}

<form method="post">
    {% csrf_token %}

    <label for="name">Name:</label>
    <input
        type="text"
        id="name"
        name="name"
        value="{{ cat.name }}"
        required
    >
    <br><br>

    <label for="age">Age:</label>
    <input
        type="number"
        id="age"
        name="age"
        value="{{ cat.age }}"
        min="0"
        required
    >
    <br><br>

    <button type="submit">Save Changes</button>
</form>

<p>
    <a href="{% url 'index' %}">Cancel</a>
</p>

</body>
</html>
